<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>

    <link rel="stylesheet" href="../style.css">
    <script src="../navbar.js" defer></script>
    <script src="../app.js" defer></script>
</head>

<body>
    <div id="nav-placeholder"></div>

<!-- Form  -->
    <div class="contact-container">
    <h1>Contact Me</h1>
    <form>
        <div class="form-group"><input type="text"  name="first-name" placeholder="First Name"></div>

        <div class="form-group"><input type="text"  name="last-name" placeholder="Last Name" required> </div>
        
        <div class="form-group"><input type="email"  name="email" placeholder="Email" required></div>
        
        <div class="form-group"><textarea  name="message" rows="6" placeholder="Message" required></textarea></div>
        
        <button type="submit" class="btn-send">Send Message</button>
    </form>
    </div>
    
</body>

</html>
