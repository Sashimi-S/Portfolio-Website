<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="icon" type="image/png" href="../images/superman-icon.png">

    <link rel="stylesheet" href="../style.css">
    <script src="../navbar.js" defer></script>
    <script src="../app.js" defer></script>
</head>

<body>
    <div id="nav-placeholder"></div>

<!-- Form  -->
    <div class="contact-container">
    <h1>Contact Me</h1>
    <form action =https://formspree.io/f/xpqellww method="POST" class="contact-form">

        <div class="form-group"><input type="text"  name="Name" placeholder="First Name"></div>

        <div class="form-group"><input type="text"  name="Surname" placeholder="Last Name" required> </div>
        
        <div class="form-group"><input type="email"  name="Email" placeholder="Email" required></div>
        
        <div class="form-group"><textarea  name="Message" rows="7" placeholder="Message" required></textarea></div>
        
        <button type="submit" class="btn-send">Send Message</button>
    </form>
    </div>
